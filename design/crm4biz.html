<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM4BIZ — D Orange</title>
<style>
/* ===== Brand tokens: change these 6 lines to re-theme the whole CRM ===== */
:root{
  --brand:#F26B1D;      /* vibrant orange – buttons, active states */
  --brand-d:#C8400B;    /* deep red-orange – hover, Hot */
  --brand-l:#FFF1E6;    /* soft orange tint */
  --gold:#F5A81C;       /* amber gold – Warm */
  --gold-l:#FFF6DD;
  --navy:#1B2A41;       /* headings */
  --text:#1F2937;--muted:#6B7280;--line:#ECE7E2;--soft:#FAF7F4;
  --good:#15803D;--good-l:#E7F6EC;--bad:#B42318;--bad-l:#FDECEA;
  --info:#2B6CB0;--info-l:#E8F1FB;--warn:#94600A;--warn-l:#FEF3C7;--mute:#5B6470;--mute-l:#F1F2F4;
  --r:10px;
  box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#fff;color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3,h4{color:var(--navy)}
a{color:var(--brand-d)}
#app{display:flex;min-height:100vh}
#side{width:216px;flex:none;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:flex-start;overflow:auto;background:#fff}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--navy);padding:4px 6px 18px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;font-style:normal;display:grid;place-items:center;font-weight:800;font-size:18px}
.logo small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.12em;color:var(--brand-d)}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;color:#374151;font-weight:500;margin:2px 0;cursor:pointer;text-decoration:none;user-select:none}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--brand-l);color:var(--brand-d);font-weight:700}
.cnt{background:var(--brand);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
#main{flex:1;min-width:0}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 24px}
#gsw{position:relative;flex:1;max-width:460px}
#gs{width:100%;border:1px solid #DDD6CF;border-radius:99px;padding:8px 14px;font:inherit}
#gsr{position:absolute;left:0;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);display:none;z-index:30;overflow:hidden}
#gsr div{padding:9px 14px;cursor:pointer;border-bottom:1px solid #F3EFEB}
#gsr div:hover{background:var(--brand-l)}
#gsr small{color:var(--muted)}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.me select{border:1px solid #DDD6CF;border-radius:8px;padding:6px 8px;font:inherit;background:#fff}
#newwrap{position:relative}
#newmenu{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);min-width:170px;display:none;z-index:30;padding:6px}
#newmenu a{display:block;padding:8px 12px;border-radius:6px;color:var(--text);cursor:pointer;text-decoration:none}
#newmenu a:hover{background:var(--brand-l)}
#banner:not(:empty){background:var(--warn-l);color:var(--warn);padding:8px 24px;font-size:13px;border-bottom:1px solid #F2E1A6}
#content{padding:24px;max-width:1320px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:21px;margin:0}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid #DDD6CF;background:#fff;color:var(--text);padding:7px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.x{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px}
.x:hover{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input[type=search],.filters select{border:1px solid #DDD6CF;border-radius:8px;padding:7px 10px;font:inherit;background:#fff}
.filters input[type=search]{min-width:220px}
.filters label{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:5px 13px;border-radius:99px;border:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--muted);background:#fff}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tab i{font-style:normal;opacity:.8;margin-left:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #F3EFEB;vertical-align:top}
tr:last-child td{border-bottom:0}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:#FFFAF5}
.r{text-align:right}
.nw{white-space:nowrap}
.mut{color:var(--muted)}
.lnk{color:var(--navy);font-weight:600;text-decoration:none}
.lnk:hover{color:var(--brand-d);text-decoration:underline}
.pager{display:flex;gap:12px;align-items:center;justify-content:flex-end;padding:8px 2px;color:var(--muted);font-size:12.5px}
.empty{border:1px dashed #E2DAD2;border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b.good{background:var(--good-l);color:var(--good)}.b.bad{background:var(--bad-l);color:var(--bad)}
.b.info{background:var(--info-l);color:var(--info)}.b.warn{background:var(--warn-l);color:var(--warn)}
.b.mute{background:var(--mute-l);color:var(--mute)}.b.brand{background:var(--brand-l);color:var(--brand-d)}
.p-hot{background:var(--brand-l);color:var(--brand-d);box-shadow:inset 0 0 0 1px #F8C9A8}
.p-warm{background:var(--gold-l);color:#8A5A00}
.p-cold{background:var(--info-l);color:var(--info)}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:#fff}
.card h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid21{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;background:#fff}
.kpi:hover{border-color:var(--brand)}
.kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.25}
.kpi.mny b{font-size:17px;padding:3px 0}
.kpi span{color:var(--muted);font-size:12px}
.kpi.hot b,.kpi.alert b{color:var(--brand-d)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip div{flex:1;min-width:98px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:#fff}
.strip div:hover{border-color:var(--brand)}
.strip b{display:block;font-size:18px;color:var(--navy)}
.strip span{font-size:11.5px;color:var(--muted)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #F3EFEB}
.li:last-child{border-bottom:0}
.li small{color:var(--muted);display:block}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--soft);border-radius:var(--r);padding:10px;min-height:160px}
.col h4{margin:0 0 8px;display:flex;justify-content:space-between;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.col h4 small{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600}
.ck{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.ck:hover{border-color:var(--brand)}
.ck.hot{border-left:3px solid var(--brand-d)}.ck.warm{border-left:3px solid var(--gold)}.ck.cold{border-left:3px solid #7AA5D2}
.ck b{display:block;color:var(--navy)}.ck small{color:var(--muted)}
.tl{border-left:2px solid var(--line);margin:8px 0 0 5px;padding-left:16px}
.tl .it{position:relative;margin-bottom:12px}
.tl .it::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.tl .it.sys::before{background:#CBD2D9}
.tl .it small{color:var(--muted)}
.tl .it.sys{color:var(--muted);font-size:13px}
.remark{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:start}
.remark textarea{grid-column:1/-1}
.ov{position:fixed;inset:0;background:rgba(27,42,65,.38);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.md{background:#fff;border-radius:14px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.28)}
.md.wide{width:min(1000px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:16px}
.mb{padding:16px 20px;max-height:72vh;overflow:auto}
.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--brand-d);font-weight:700;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
.g2,.g3,.g4{display:grid;gap:12px;margin-bottom:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.f input,.f select,.f textarea,.it input,.soc-row input,.soc-row select{font:inherit;font-weight:400;color:var(--text);border:1px solid #DDD6CF;border-radius:8px;padding:7px 10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(242,107,29,.3);border-color:var(--brand)}
.bad{border-color:var(--bad)!important}
.soc-row{display:grid;grid-template-columns:150px 1fr 32px;gap:8px;margin-bottom:6px}
.it input{padding:5px 8px}
#tot{margin-top:12px;margin-left:auto;width:min(320px,100%);font-size:13.5px}
#tot div{display:flex;justify-content:space-between;padding:2px 0}
#tot .gt{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-size:15px;color:var(--navy)}
.note{background:var(--brand-l);border-radius:8px;padding:8px 12px;color:var(--brand-d);font-size:13px;margin-bottom:12px}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 11px;font-size:13px}
.chip .x{font-size:16px;padding:0 5px}
.inl{display:flex;gap:8px;margin-top:8px}
.inl input{flex:1;border:1px solid #DDD6CF;border-radius:8px;padding:7px 10px;font:inherit}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:10px;z-index:80;display:none;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.err{background:var(--bad)}
@media (max-width:860px){
  #app{flex-direction:column}
  #side{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
  .logo{padding-bottom:8px}
  .nav{display:flex;gap:4px;overflow-x:auto}
  .nav a{white-space:nowrap}
  #top{padding:10px 14px;flex-wrap:wrap}
  #content{padding:14px}
  .g2,.g3,.g4,.grid2,.grid21{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  .me span{display:none}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="main">
    <header id="top">
      <div id="gsw"><input id="gs" type="search" placeholder="Search leads & customers…" autocomplete="off"><div id="gsr"></div></div>
      <div class="spacer"></div>
      <div class="me"><span>Working as</span><select id="me"></select></div>
      <div id="newwrap"><button class="btn pri" data-act="newmenu">+ New</button>
        <div id="newmenu">
          <a data-act="new" data-id="lead">Lead</a><a data-act="new" data-id="inquiry">Inquiry</a><a data-act="new" data-id="followup">Follow-up</a>
          <a data-act="new" data-id="proposal">Proposal</a><a data-act="new" data-id="invoice">Invoice</a><a data-act="new" data-id="payment">Payment</a>
          <a data-act="new" data-id="eoi">EoI</a><a data-act="new" data-id="rfq">RFQ</a>
        </div>
      </div>
    </header>
    <div id="banner"></div>
    <main id="content"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   CRM4BIZ – D Orange   |   single-file CRM, shared data via artifact db
   Sections: config · store · helpers · domain rules · views · forms · pdf · init
   ===================================================================== */

/* ---------- config ---------- */
const LS_KEY='crm4biz_v1', LS_ME='crm4biz_me';
const COLS=['companies','inquiries','followups','remarks','proposals','invoices','payments','docs'];
const PRIOS=['Hot','Warm','Cold'];
const LSTATUS=['Not Contacted','Contacted','Qualified','Unqualified','Archived'];
const SOURCES=['Website','WhatsApp','Phone','Email','Facebook','Instagram','LinkedIn','Referral','Sales Prospecting','Campaign','Other'];
const ISTATUS=['New','In Progress','Proposal Required','Proposal Sent','Negotiation','Won','Lost','On Hold'];
const OPEN_I=['New','In Progress','Proposal Required','Proposal Sent','Negotiation'];
const PSTATUS=['Draft','Sent','Under Discussion','Negotiation','Accepted','Rejected','Expired','Cancelled'];
const OPEN_P=['Draft','Sent','Under Discussion','Negotiation'];
const METHODS=['Phone','WhatsApp','Email','Meeting','Video Call','Other'];
const PAYM=['Bank Transfer','Cash','Card','Online Payment','Cheque','Other'];
const STAGES=['New Lead','Contacted','Qualified','Inquiry','Proposal','Negotiation','Won','Lost'];
const CURS=['GBP','AED','USD','PKR','EUR'];
const SOCIALS=['Facebook','Instagram','LinkedIn','TikTok','YouTube','X / Twitter','Other'];
const DEFAULTS={
  agents:['Emma'],currency:'GBP',taxPct:0,terms:'',
  company:{name:'D Orange',tagline:'Conductors of Creativity',address:'Highbank House, Exchange Street, Stockport, SK3 0ET, United Kingdom',email:'info@dorange.com',phone:'+44 7376 075378',website:'dorange.co.uk'},
  categories:['Real Estate','Automotive','Food & Beverage','Retail & E-commerce','Healthcare','Beauty & Wellness','Education','Finance & Accounting','HR & Recruitment','Manufacturing','Hospitality','Technology','Other'],
  services:{
    'Digital Marketing':['SEO','Social Media Management','Google Ads','Meta Ads','Content Marketing','Local SEO'],
    'Website':['Corporate Website','Landing Page','E-commerce','Redesign','Maintenance'],
    'Creative':['Graphic Design','Branding','Video','Motion Graphics'],
    'Software / IT':['Custom Software','CRM','Mobile App','API Integration','Maintenance'],
    'AI / Automation':['AI Agent','Chatbot','Workflow Automation','WhatsApp Automation'],
    'Other':['Other']}
};

/* ---------- state ---------- */
const S={}; COLS.forEach(c=>S[c]=new Map());
const pend={}; COLS.forEach(c=>pend[c]=new Map());
let settings=JSON.parse(JSON.stringify(DEFAULTS));
let db=null, dl=null, assets=null, isAdmin=true, IX={};
const defF=()=>({leads:{q:'',prio:'',status:'',agent:'',src:'',arch:false,page:0},
  inquiries:{q:'',status:'',prio:'',cat:'',page:0},followups:{tab:'due',agent:'',page:0},
  customers:{q:'',page:0},documents:{type:'',q:'',page:0},pipeline:{agent:''}});
const ui={view:'dashboard',id:null,period:30,me:'',f:defF()};

/* ---------- storage layer (db when available, localStorage fallback) ---------- */
let writeQ=Promise.resolve();
function dbWrite(fn,done){
  writeQ=writeQ.then(fn).catch(e=>{console.error(e);toast('Could not save to the shared database ('+((e&&(e.code||e.message))||'error')+')','err')}).then(()=>{if(done)done()});
  return writeQ;
}
function clean(o){return JSON.parse(JSON.stringify(o))}
function put(col,rec){
  rec=clean(rec); S[col].set(rec.id,rec);
  if(db){const tok={rec};pend[col].set(rec.id,tok);dbWrite(()=>db.collection(col).doc(rec.id).set(rec),()=>{if(pend[col].get(rec.id)===tok)pend[col].delete(rec.id)})}
  else lsSave();
  scheduleRender(); return rec;
}
function del(col,id){
  S[col].delete(id);
  if(db){const tok={rec:null};pend[col].set(id,tok);dbWrite(()=>db.collection(col).doc(id).delete(),()=>{if(pend[col].get(id)===tok)pend[col].delete(id)})}
  else lsSave();
  scheduleRender();
}
function saveSettings(){
  if(db) dbWrite(()=>db.doc('settings/main').set(clean(settings))); else lsSave();
  scheduleRender();
}
function applySnap(col,snap){
  const m=new Map(); snap.docs.forEach(d=>m.set(d.id,d.data()));
  for(const [id,t] of pend[col]){ if(t.rec) m.set(id,t.rec); else m.delete(id); }
  S[col]=m; scheduleRender();
}
function lsSave(){try{const o={settings};COLS.forEach(c=>o[c]=[...S[c].values()]);localStorage.setItem(LS_KEY,JSON.stringify(o))}catch(e){}}
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(!o)return;COLS.forEach(c=>{S[c]=new Map((o[c]||[]).map(r=>[r.id,r]))});if(o.settings)mergeSettings(o.settings)}catch(e){}}
function mergeSettings(s){settings=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),s||{});settings.company=Object.assign({},DEFAULTS.company,(s&&s.company)||{})}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const pad=n=>String(n).padStart(2,'0');
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowS=()=>{const d=new Date();return todayS()+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(s,n)=>{const d=new Date(s.slice(0,10)+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fD=s=>{if(!s)return '—';const [y,m,d]=s.slice(0,10).split('-');return `${+d} ${MON[+m-1]} ${y}`};
const fDT=s=>!s?'—':fD(s)+(s.length>10?', '+s.slice(11,16):'');
const money=(n,c)=>{try{return new Intl.NumberFormat('en-GB',{style:'currency',currency:c||settings.currency}).format(n||0)}catch(e){return (c||'')+' '+(n||0).toFixed(2)}};
const curSum=arr=>{const m={};arr.forEach(([c,a])=>{m[c||settings.currency]=(m[c||settings.currency]||0)+a});const k=Object.keys(m);return k.length?k.map(c=>money(m[c],c)).join(' · '):money(0,settings.currency)};
const rid=()=>'R'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function nextSeq(prefix,keys){let m=0;for(const k of keys){if(typeof k==='string'&&k.startsWith(prefix+'-')){const n=parseInt(k.slice(prefix.length+1),10);if(n>m)m=n}}return prefix+'-'+String(m+1).padStart(5,'0')}
const co=id=>S.companies.get(id)||{name:'(deleted record)',id};
const coLink=id=>`<a class="lnk" data-act="co-open" data-id="${esc(id)}">${esc(co(id).name)}</a>`;
const url=u=>u?(/^https?:/i.test(u)?u:'https://'+u):'';
const ext=(u,t)=>u?`<a href="${esc(url(u))}" target="_blank" rel="noopener">${esc(t||u)}</a>`:'—';
const trunc=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const agents=()=>settings.agents.length?settings.agents:['Unassigned'];
const TONE={good:['Qualified','Won','Accepted','Paid','Completed','Recorded','Responded'],warn:['Not Contacted','In Progress','Proposal Required','Partially Paid','Under Discussion','Pending'],
  info:['Contacted','New','Sent','Proposal Sent','Issued','Open','Received'],brand:['Negotiation'],bad:['Lost','Rejected','Overdue','Reversed']};
const tone=s=>Object.keys(TONE).find(k=>TONE[k].includes(s))||'mute';
const badge=(t,c)=>`<span class="b ${c||tone(t)}">${esc(t)}</span>`;
const prioB=p=>p?`<span class="b p-${esc(p.toLowerCase())}">● ${esc(p)}</span>`:'';
function toast(m,k){const t=$('#toast');t.textContent=m;t.className=k==='err'?'err':'';t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',k==='err'?5000:2600)}
function grp(col,key){const m={};S[col].forEach(r=>{(m[r[key]]||(m[r[key]]=[])).push(r)});return m}
function buildIx(){IX={inq:grp('inquiries','companyId'),fu:grp('followups','companyId'),prop:grp('proposals','companyId'),inv:grp('invoices','companyId'),doc:grp('docs','companyId'),rem:grp('remarks','companyId'),pay:grp('payments','companyId')}}

/* ---------- domain rules ---------- */
function totals(rec){const sub=(rec.items||[]).reduce((a,i)=>a+num(i.qty)*num(i.price),0);const disc=Math.min(num(rec.discount),sub);const tax=(sub-disc)*num(rec.taxPct)/100;return{sub:r2(sub),disc:r2(disc),tax:r2(tax),total:r2(sub-disc+tax)}}
function paidFor(invId,skipPayId){let s=0;S.payments.forEach(p=>{if(p.invoiceId===invId&&p.status!=='Reversed'&&p.status!=='Cancelled'&&p.id!==skipPayId)s+=num(p.amount)});return r2(s)}
function invInfo(inv){
  const t=totals(inv),paid=paidFor(inv.id),bal=Math.max(0,r2(t.total-paid));const late=inv.due&&inv.due<todayS();let st;
  if(inv.state==='Draft')st='Draft';else if(inv.state==='Cancelled')st='Cancelled';
  else if(t.total>0&&bal<=0.005)st='Paid';else if(late)st='Overdue';else if(paid>0)st='Partially Paid';else st='Issued';
  return Object.assign({},t,{paid,bal,status:st});
}
const isOpenInv=i=>['Issued','Partially Paid','Overdue'].includes(invInfo(i).status);
function nextFU(cid){let m=null;S.followups.forEach(f=>{if(f.companyId===cid&&f.status==='Pending'&&(!m||f.due<m))m=f.due});return m}
function logEv(cid,text,kind){const id=rid();put('remarks',{id,companyId:cid,kind:kind||'System',text,by:ui.me,at:nowS()})}
function mkFU(cid,o){const id=nextSeq('FU',S.followups.keys());return put('followups',Object.assign({id,companyId:cid,agent:ui.me,method:'Phone',purpose:'Follow-up',status:'Pending',createdAt:nowS()},o))}
function touchContacted(cid){const c=S.companies.get(cid);if(!c)return;const n=Object.assign({},c,{lastContacted:todayS()});if(c.status==='Not Contacted'){n.status='Contacted';logEv(cid,'Status changed: Not Contacted → Contacted')}put('companies',n)}
function ensureCustomer(cid){
  const c=S.companies.get(cid);if(!c||c.type==='Customer')return;
  const no=nextSeq('C',[...S.companies.values()].map(x=>x.customerNo));
  put('companies',Object.assign({},c,{type:'Customer',customerNo:no,convertedAt:todayS(),status:['Not Contacted','Contacted'].includes(c.status)?'Qualified':c.status}));
  logEv(cid,'Converted to customer '+no);toast(c.name+' is now customer '+no);
}
function syncInquiry(p,prev){
  if(!p.inquiryId||p.status===prev)return;const i=S.inquiries.get(p.inquiryId);if(!i)return;let st=null;
  if(p.status==='Sent'&&['New','In Progress','Proposal Required'].includes(i.status))st='Proposal Sent';
  if(['Under Discussion','Negotiation'].includes(p.status)&&!['Won','Lost'].includes(i.status))st='Negotiation';
  if(p.status==='Accepted')st='Won';
  if(p.status==='Rejected'&&i.status!=='Won')st='Lost';
  if(st&&st!==i.status){const n=Object.assign({},i,{status:st});if(st==='Won'||st==='Lost')n.closedAt=todayS();put('inquiries',n);logEv(i.companyId,`Inquiry ${i.id} → ${st}`)}
}
/* pipeline stage is derived automatically from status + inquiries + proposals (no double entry) */
function stageOf(c){
  const inqs=IX.inq[c.id]||[],props=IX.prop[c.id]||[];
  const open=inqs.filter(i=>OPEN_I.includes(i.status)),oprops=props.filter(p=>OPEN_P.includes(p.status));
  if(open.length||oprops.length){
    if(oprops.some(p=>['Under Discussion','Negotiation'].includes(p.status))||open.some(i=>i.status==='Negotiation'))return{stage:'Negotiation'};
    if(oprops.length||open.some(i=>['Proposal Required','Proposal Sent'].includes(i.status)))return{stage:'Proposal'};
    return{stage:'Inquiry'};
  }
  const won=inqs.filter(i=>i.status==='Won');
  if(won.length)return{stage:'Won',date:won.map(i=>i.closedAt||i.date||'').sort().pop().slice(0,10)};
  if(c.type==='Customer')return{stage:'Won',date:c.convertedAt||todayS()};
  const lost=inqs.filter(i=>i.status==='Lost');
  if(lost.length&&lost.length===inqs.length)return{stage:'Lost',date:lost.map(i=>i.closedAt||'').sort().pop().slice(0,10)};
  return{stage:c.status==='Qualified'?'Qualified':c.status==='Contacted'?'Contacted':'New Lead'};
}
function dealValue(c,stage){
  const props=IX.prop[c.id]||[];let use;
  if(stage==='Won')use=props.filter(p=>p.status==='Accepted');else use=props.filter(p=>OPEN_P.includes(p.status));
  if(use.length)return curSum(use.map(p=>[p.currency,totals(p).total]));
  if(stage==='Won'||stage==='Lost')return '';
  const b=(IX.inq[c.id]||[]).filter(i=>OPEN_I.includes(i.status)).reduce((a,i)=>a+num(i.budgetTo||i.budgetFrom),0);
  return b?money(b,settings.currency):'';
}

/* ---------- rendering ---------- */
let rq=null;
function scheduleRender(){if(rq)return;rq=setTimeout(()=>{rq=null;render()},0)}
function render(){
  buildIx();
  const ae=document.activeElement,fid=ae&&ae.dataset&&ae.dataset.f,pos=ae&&ae.selectionStart;
  $('#side').innerHTML=navHtml();
  $('#content').innerHTML=viewHtml();
  if(fid){const n=$(`[data-f="${fid}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
}
function go(view,id,f){ui.view=view;ui.id=id||null;if(f&&ui.f[view])Object.assign(ui.f[view],defF()[view],f);closeModal();render();window.scrollTo(0,0)}
function navHtml(){
  const od=[...S.followups.values()].filter(f=>f.status==='Pending'&&f.due<nowS()).length;
  const cur=ui.view==='company'?(co(ui.id).type==='Customer'?'customers':'leads'):ui.view;
  const it=[['dashboard','Dashboard'],['leads','Leads'],['pipeline','Pipeline'],['inquiries','Inquiries'],['followups','Follow-ups',od],['customers','Customers'],['documents','Documents'],['settings','Settings']];
  return `<div class="logo"><i>D</i><div>D Orange<small>CRM4BIZ</small></div></div><nav class="nav">${it.map(([k,l,n])=>`<a data-act="nav" data-id="${k}" class="${cur===k?'on':''}">${l}${n?`<span class="cnt">${n}</span>`:''}</a>`).join('')}</nav>`;
}
function viewHtml(){
  switch(ui.view){
    case 'leads':return vLeads();case 'pipeline':return vPipeline();case 'inquiries':return vInquiries();
    case 'followups':return vFollowups();case 'customers':return vCustomers();case 'documents':return vDocuments();
    case 'company':return vCompany(ui.id);case 'settings':return vSettings();default:return vDashboard();
  }
}
const head=(t,sub,btns)=>`<div class="ph"><div><h1>${t}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div>${btns||''}</div></div>`;
function tbl(cols,rows,act,empty){
  if(!rows.length)return `<div class="empty">${empty||'Nothing here yet.'}</div>`;
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th${c[2]?` class="${c[2]}"`:''}>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>{const a=typeof act==='function'?act(r):act;return `<tr${a?` data-act="${a}" data-id="${esc(r.id)}"`:''}>${cols.map(c=>`<td${c[2]?` class="${c[2]}"`:''}>${c[1](r)}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`;
}
const PG=20;
function paged(list,key){
  const f=ui.f[key],pages=Math.max(1,Math.ceil(list.length/PG));if(f.page>=pages)f.page=pages-1;
  const rows=list.slice(f.page*PG,f.page*PG+PG);
  return{rows,pager:`<div class="pager">${list.length>PG?`<button class="btn sm" data-act="pg" data-id="${key}:-1"${f.page<=0?' disabled':''}>‹ Prev</button><span>Page ${f.page+1} of ${pages}</span><button class="btn sm" data-act="pg" data-id="${key}:1"${f.page>=pages-1?' disabled':''}>Next ›</button>`:''}<span>${list.length} record${list.length===1?'':'s'}</span></div>`};
}
const fSel=(key,name,opts,label)=>`<select data-f="${key}.${name}"><option value="">${label}</option>${optHtml(opts,ui.f[key][name])}</select>`;
const hay=c=>[c.id,c.customerNo,c.name,c.contact,c.phone,c.phone2,c.whatsapp,c.email,c.category,c.website].join(' ').toLowerCase();

/* ---------- dashboard ---------- */
function vDashboard(){
  const P=ui.period,from=P?addDays(todayS(),-P):'0000-00-00',now=nowS(),td=todayS();
  const cos=[...S.companies.values()],pros=cos.filter(c=>c.type==='Prospect'),live=pros.filter(c=>!['Archived','Unqualified'].includes(c.status));
  const pf=[...S.followups.values()].filter(f=>f.status==='Pending');
  const over=pf.filter(f=>f.due<now),today=pf.filter(f=>f.due>=now&&f.due.slice(0,10)===td);
  const inqs=[...S.inquiries.values()],props=[...S.proposals.values()];
  const won=inqs.filter(i=>i.status==='Won'&&(i.closedAt||i.date||'')>=from).length,lost=inqs.filter(i=>i.status==='Lost'&&(i.closedAt||i.date||'')>=from).length;
  const pipe=curSum(props.filter(p=>['Sent','Under Discussion','Negotiation'].includes(p.status)).map(p=>[p.currency,totals(p).total]));
  const out=curSum([...S.invoices.values()].filter(isOpenInv).map(i=>[i.currency,invInfo(i).bal]));
  const rec=curSum([...S.payments.values()].filter(p=>p.status!=='Reversed'&&p.status!=='Cancelled'&&(p.date||'')>=from).map(p=>{const i=S.invoices.get(p.invoiceId);return[i&&i.currency,num(p.amount)]}));
  const K=(l,v,go,f,cls)=>`<div class="kpi ${cls||''}" data-act="kpi" data-id="${go}" data-f='${esc(JSON.stringify(f||{}))}'><b>${v}</b><span>${l}</span></div>`;
  const stages={};STAGES.forEach(s=>stages[s]=0);cos.forEach(c=>{if(['Archived','Unqualified'].includes(c.status))return;const st=stageOf(c);if(!st)return;if((st.stage==='Won'||st.stage==='Lost')&&st.date<addDays(td,-30))return;stages[st.stage]++});
  const empty=!cos.length;
  const fuList=[...over,...today].sort((a,b)=>a.due.localeCompare(b.due)).slice(0,8);
  const hot=live.filter(c=>c.priority==='Hot').sort((a,b)=>(a.lastContacted||'').localeCompare(b.lastContacted||'')).slice(0,6);
  return head('Dashboard','Your sales day at a glance',`<div class="tabs" style="margin:0">${[[7,'7 days'],[30,'30 days'],[90,'90 days'],[0,'All time']].map(([v,l])=>`<span class="tab${P===v?' on':''}" data-act="period" data-id="${v}">${l}</span>`).join('')}</div>`)
  +(empty?`<div class="note"><b>Welcome to CRM4BIZ.</b> Add your first lead with “+ New”, or load a few demo records to look around (Settings → Demo data, or <a data-act="demo-load" style="cursor:pointer">load them now</a>).</div>`:'')
  +`<div class="kpis">
    ${K('New leads ('+(P?P+'d':'all')+')',pros.filter(c=>(c.createdAt||'').slice(0,10)>=from).length,'leads')}
    ${K('Hot leads',live.filter(c=>c.priority==='Hot').length,'leads',{prio:'Hot'},'hot')}
    ${K('Not contacted',live.filter(c=>c.status==='Not Contacted').length,'leads',{status:'Not Contacted'})}
    ${K('Overdue follow-ups',over.length,'followups',{tab:'overdue'},over.length?'alert':'')}
    ${K("Today's follow-ups",today.length+over.filter(f=>f.due.slice(0,10)===td).length,'followups',{tab:'due'})}
    ${K('Open inquiries',inqs.filter(i=>OPEN_I.includes(i.status)).length,'inquiries')}
    ${K('Proposals sent ('+(P?P+'d':'all')+')',props.filter(p=>p.status!=='Draft'&&(p.date||'')>=from).length,'documents',{type:'Proposal'})}
    ${K('Won / Lost ('+(P?P+'d':'all')+')',won+' / '+lost,'pipeline')}
    ${K('Pipeline value',pipe,'pipeline','','mny')}
    ${K('Outstanding invoices',out,'documents',{type:'Invoice'},'mny')}
    ${K('Payments received',rec,'documents',{type:'Payment'},'mny')}
  </div>
  <div class="card" style="margin-bottom:14px"><h3>Pipeline <a class="lnk" data-act="nav" data-id="pipeline" style="font-weight:600;font-size:12.5px">Open board →</a></h3><div class="strip">${STAGES.map(s=>`<div data-act="nav" data-id="pipeline"><b>${stages[s]}</b><span>${s}</span></div>`).join('')}</div></div>
  <div class="grid2">
   <div class="card"><h3>Follow-ups needing action</h3>${fuList.length?fuList.map(f=>`<div class="li"><div>${coLink(f.companyId)}<small>${esc(f.purpose||f.method)} · ${esc(f.method)} · ${esc(f.agent||'')}</small></div><div class="r nw">${f.due<now?badge('Overdue'):''}<small>${fDT(f.due)}</small><button class="btn sm" data-act="fu-done" data-id="${f.id}">Done</button></div></div>`).join(''):'<div class="empty">No follow-ups due. 🎉</div>'}</div>
   <div class="card"><h3>Hot leads to work</h3>${hot.length?hot.map(c=>`<div class="li"><div>${coLink(c.id)}<small>${esc(c.contact||'')} · ${esc(c.phone||'')}</small></div><div class="r nw">${statB(c.status)}<small>Last contact: ${fD(c.lastContacted)}</small></div></div>`).join(''):'<div class="empty">No hot leads yet.</div>'}</div>
  </div>`;
}

/* ---------- leads ---------- */
function vLeads(){
  const f=ui.f.leads,q=f.q.toLowerCase();
  const list=[...S.companies.values()].filter(c=>c.type==='Prospect').filter(c=>{
    if(f.prio&&c.priority!==f.prio)return false;if(f.status&&c.status!==f.status)return false;if(f.agent&&c.agent!==f.agent)return false;if(f.src&&c.source!==f.src)return false;

/* ---------- pipeline ---------- */

  const f=ui.f.pipeline,td=todayS(),cut=addDays(td,-30),by={};STAGES.forEach(s=>by[s]=[]);

/* ---------- documents (EoI · RFQ · Proposal · Invoice · Payment) ---------- */
function allDocs(){
  const out=[];

  S.proposals.forEach(p=>out.push({key:'pr:'+p.id,id:p.id,type:'Proposal',ref:p.id,co:p.companyId,date:p.date,amount:money(totals(p).total,p.currency),status:p.status,act:'pr-edit',pdf:'proposal:'+p.id}));
  S.invoices.forEach(i=>{const n=invInfo(i);out.push({key:'inv:'+i.id,id:i.id,type:'Invoice',ref:i.id,co:i.companyId,date:i.date,amount:money(n.total,i.currency),status:n.status,act:'inv-edit',pdf:'invoice:'+i.id,note:n.bal>0&&n.status!=='Draft'&&n.status!=='Cancelled'?'Balance '+money(n.bal,i.currency):''})});
  S.payments.forEach(p=>{const i=S.invoices.get(p.invoiceId)||{};out.push({key:'pay:'+p.id,id:p.id,type:'Payment',ref:p.id,co:p.companyId||i.companyId,date:p.date,amount:money(num(p.amount),i.currency),status:p.status||'Recorded',act:'pay-edit',pdf:'receipt:'+p.id,note:p.invoiceId})});

/* ---------- CSV export ---------- */
function exportCsv(col){
  const rows=[...S[col].values()];if(!rows.length){toast('Nothing to export yet','err');return}
  const flat=rows.map(r=>{const o={};Object.keys(r).forEach(k=>{if(!['items','files','socials','demo'].includes(k))o[k]=r[k]});
    if(col==='invoices'||col==='proposals'){const t=totals(r);o.subtotal=t.sub;o.total=t.total;o.lines=(r.items||[]).map(i=>`${i.service} x${i.qty} @${i.price}`).join(' | ');if(col==='invoices')o.status=invInfo(r).status}
    if(col==='companies')o.socials=(r.socials||[]).map(s=>s.network+': '+s.url).join(' | ');return o});
  const cols=[...new Set(flat.flatMap(o=>Object.keys(o)))],q=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  saveFile(`crm4biz-${col}-${todayS()}.csv`,'\ufeff'+[cols.join(','),...flat.map(o=>cols.map(k=>q(o[k])).join(','))].join('\n'));
}

    db=d;
    COLS.forEach(c=>db.collection(c).onSnapshot(s=>applySnap(c,s),e=>console.error(c,e)));
    db.doc('settings/main').onSnapshot(s=>{if(s.exists)mergeSettings(s.data());scheduleRender()},e=>console.error(e));
  }else{
    lsLoad();$('#banner').textContent='The shared database is not available in this view — records are saved on this device only.';
  }
  render();
})();
</script>
</body>
</html>
